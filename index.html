<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaPort - Port Management System</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Application Container -->
    <div id="app-container" class="hidden">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-anchor icon-logo"></i>
                <h2>NexaPort</h2>
            </div>
            
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Navigation links will be injected here based on role -->
            </nav>
            
            <div class="sidebar-footer">
                <button class="nav-item text-danger" onclick="app.logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top Navigation Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="app.toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="User Profile" id="user-avatar">
                        <div class="user-info">
                            <span class="user-name" id="user-name">John Doe</span>
                            <span class="user-role" id="user-role-display">Admin</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <main class="content-container" id="main-content">
                <!-- Content is injected from templates here -->
            </main>
        </div>
    </div>


    <!-- ============================================== -->
    <!-- TEMPLATES (Hidden, cloned via JS into app)     -->
    <!-- ============================================== -->

    <!-- Template: Login View -->
    <template id="tpl-login-view">
        <div class="login-wrapper">
            <div class="login-glass-card">
                <div class="login-header">
                    <i class="fa-solid fa-anchor icon-logo main-logo-icon"></i>
                    <h2>Welcome to NexaPort</h2>
                    <p>Advanced Integrated Port Management System</p>
                </div>
                <form id="login-form" onsubmit="event.preventDefault(); app.handleLogin();">
                    <div class="form-group">
                        <label>Select Role</label>
                        <select id="login-role" class="input-modern" required>
                            <option value="" disabled selected>Choose your authority level</option>
                            <option value="admin">System Admin</option>
                            <option value="ship_agent">Ship Agent</option>
                            <option value="port_authority">Port Authority</option>
                            <option value="customs_officer">Customs Officer</option>
                            <option value="health_officer">Health Officer</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="otp-group" style="display:none;">
                        <label>2FA / OTP Code</label>
                        <div class="otp-inputs">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                            <input type="text" maxlength="1">
                        </div>
                        <p class="helper-text text-sm">A secure code has been sent to your device.</p>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Continue to Portal</button>
                </form>
            </div>
            
            <!-- Abstract background elements -->
            <div class="bg-blob blob-1"></div>
            <div class="bg-blob blob-2"></div>
        </div>
    </template>

    <!-- Template: Common Dashboard -->
    <template id="tpl-dashboard-view">
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-icon bg-blue-light"><i class="fa-solid fa-ship text-blue"></i></div>
                <div class="stat-details">
                    <h3>Active Vessels</h3>
                    <h2>24</h2>
                    <span class="trend positive"><i class="fa-solid fa-arrow-up"></i> 12% from last week</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green-light"><i class="fa-solid fa-clipboard-check text-green"></i></div>
                <div class="stat-details">
                    <h3>Pending Clearances</h3>
                    <h2>8</h2>
                    <span class="trend negative"><i class="fa-solid fa-arrow-down"></i> Action required</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-purple-light"><i class="fa-solid fa-clock text-purple"></i></div>
                <div class="stat-details">
                    <h3>Avg. Port Time</h3>
                    <h2>3.2 Days</h2>
                    <span class="trend positive"><i class="fa-solid fa-arrow-up"></i> Optimal</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-orange-light"><i class="fa-solid fa-anchor text-orange"></i></div>
                <div class="stat-details">
                    <h3>Berths Occupied</h3>
                    <h2>85%</h2>
                    <span class="trend negative"><i class="fa-solid fa-arrow-up"></i> Near capacity</span>
                </div>
            </div>
        </div>

        <div class="panels-grid mt-4">
            <div class="panel">
                <div class="panel-header">
                    <h3>Recent Clearances</h3>
                    <button class="btn btn-sm btn-outline">View All</button>
                </div>
                <div class="table-responsive">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th>Vessel Name</th>
                                <th>IMO Number</th>
                                <th>Agent</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><div class="vessel-badge">⚓ Ever Glory</div></td>
                                <td>9841235</td>
                                <td>Marbella Logistics</td>
                                <td><span class="status-badge status-approved">Approved</span></td>
                                <td><button class="btn-icon"><i class="fa-solid fa-eye"></i></button></td>
                            </tr>
                            <tr>
                                <td><div class="vessel-badge">⚓ Oceanic Pioneer</div></td>
                                <td>9235123</td>
                                <td>SeaTrans Ltd.</td>
                                <td><span class="status-badge status-pending">Pending Review</span></td>
                                <td><button class="btn-icon"><i class="fa-solid fa-eye"></i></button></td>
                            </tr>
                            <tr>
                                <td><div class="vessel-badge">⚓ Nordic Star</div></td>
                                <td>9561234</td>
                                <td>Nordic Freight</td>
                                <td><span class="status-badge status-review">health check..</span></td>
                                <td><button class="btn-icon"><i class="fa-solid fa-eye"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>System Alerts</h3>
                </div>
                <ul class="alert-list">
                    <li class="alert-item warning">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <div>
                            <h4>High Winds Expected</h4>
                            <p>Berth operations might be affected tomorrow 14:00.</p>
                        </div>
                    </li>
                    <li class="alert-item error">
                        <i class="fa-solid fa-file-circle-xmark"></i>
                        <div>
                            <h4>Missing Documentation</h4>
                            <p>Vessel "Pacific Sun" missing health declaration form.</p>
                        </div>
                    </li>
                    <li class="alert-item info">
                        <i class="fa-solid fa-circle-info"></i>
                        <div>
                            <h4>System Update</h4>
                            <p>Customs API sync successful.</p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </template>

    <!-- Template: Vessel Management -->
    <template id="tpl-vessel-reg-view">
        <div class="panel">
            <div class="panel-header">
                <h3>Register New Vessel</h3>
                <p class="text-sm text-muted">Enter core vessel details for the port registry.</p>
            </div>
            <form class="modern-form mt-4">
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label>Vessel Name</label>
                        <input type="text" class="input-modern" placeholder="e.g. Ever Glory">
                    </div>
                    <div class="form-group flex-1">
                        <label>IMO Number</label>
                        <input type="text" class="input-modern" placeholder="7-digit IMO number">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label>Flag State</label>
                        <select class="input-modern">
                            <option>Panama</option>
                            <option>Liberia</option>
                            <option>Marshall Islands</option>
                            <option>Hong Kong</option>
                            <option>Singapore</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label>Vessel Type</label>
                        <select class="input-modern">
                            <option>Container Ship</option>
                            <option>Bulk Carrier</option>
                            <option>Oil Tanker</option>
                            <option>Passenger / Cruise</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Owner / Operator Details</label>
                    <textarea class="input-modern" rows="3" placeholder="Company Name, Address, Contact Info"></textarea>
                </div>
                <div class="form-group file-upload-wrapper">
                    <label>Upload Certificates</label>
                    <div class="file-drop-zone">
                        <i class="fa-solid fa-cloud-arrow-up fa-3x"></i>
                        <p>Drag and drop PDF certificates here, or click to browse</p>
                        <span class="text-sm">Max size: 25MB. Accepted formats: .pdf, .jpg</span>
                    </div>
                </div>
                <div class="form-actions right">
                    <button type="button" class="btn btn-outline" onclick="app.navigate('vessel-management')">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="alert('Vessel Registered Successfully!')"><i class="fa-solid fa-check"></i> Register Vessel</button>
                </div>
            </form>
        </div>
    </template>

    <!-- Template: Port Clearance Application -->
    <template id="tpl-clearance-app-view">
        <div class="application-container">
            <div class="stepper">
                <div class="step active"><span>1</span> Arrival Info</div>
                <div class="step"><span>2</span> Cargo/Crew</div>
                <div class="step"><span>3</span> Documents</div>
                <div class="step"><span>4</span> Review</div>
            </div>
            
            <div class="panel mt-4">
                <h3>1. Journey Details</h3>
                <form class="modern-form mt-4">
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label>Select Vessel</label>
                            <select class="input-modern">
                                <option>Ever Glory (IMO: 9841235)</option>
                                <option>Pacific Sun (IMO: 9112345)</option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label>Last Port of Call</label>
                            <input type="text" class="input-modern" placeholder="Port Name, Country">
                        </div>
                    </div>
                     <div class="form-row">
                        <div class="form-group flex-1">
                            <label>Estimated Time of Arrival (ETA)</label>
                            <input type="datetime-local" class="input-modern">
                        </div>
                        <div class="form-group flex-1">
                            <label>Estimated Time of Departure (ETD)</label>
                            <input type="datetime-local" class="input-modern">
                        </div>
                    </div>
                    <div class="form-actions mt-4 text-center">
                        <button type="button" class="btn btn-primary" onclick="alert('Proceeding to Next Step (Demo)')">Next Step <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </template>

    <!-- Template: Authority Approval Module (Split View) -->
    <template id="tpl-authority-approval-view">
        <div class="approval-split-view">
            <!-- Document Viewer Side -->
            <div class="doc-viewer-side panel">
                <div class="panel-header">
                    <h3>Document Review</h3>
                    <div class="doc-controls">
                        <button class="btn-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                        <button class="btn-icon"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                        <button class="btn-icon"><i class="fa-solid fa-download"></i></button>
                    </div>
                </div>
                <div class="mock-pdf-viewer">
                    <div class="mock-pdf-page">
                        <div class="pdf-header">CUSTOMS DECLARATION FORM</div>
                        <p><strong>Vessel:</strong> Ever Glory IMO 9841235</p>
                        <p><strong>Cargo:</strong> 15,000 TEUs</p>
                        <p><strong>Origin:</strong> Shanghai</p>
                        <table class="simple-table">
                            <tr><th>Item ID</th><th>Description</th><th>Weight (Tons)</th></tr>
                            <tr><td>C-001</td><td>Electronics</td><td>540.5</td></tr>
                            <tr><td>C-002</td><td>Auto Parts</td><td>1,200.0</td></tr>
                        </table>
                        <div class="pdf-footer">[Digital Signature Verified <i class="fa-solid fa-certificate text-green"></i>]</div>
                    </div>
                </div>
            </div>
            
            <!-- Action Side -->
            <div class="action-side panel">
                <h3>Clearance Action</h3>
                <p class="text-sm mb-4">Request Ref: #CLR-2024-991A</p>
                <div class="status-timeline">
                     <h4>Current Workflow Status</h4>
                     <ul class="timeline-simple mt-2">
                         <li class="done">Submitted by Agent</li>
                         <li class="done">Health & Quarantine (Cleared)</li>
                         <li class="active">Customs Officer (Pending)</li>
                     </ul>
                </div>

                <div class="form-group mt-4">
                    <label>Reviewer Remarks</label>
                    <textarea class="input-modern" rows="4" placeholder="Enter findings, issues, or approval notes..."></textarea>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox"> Risk assessment completed and verified
                    </label>
                </div>

                <div class="action-buttons-group">
                    <button class="btn btn-danger flex-1" onclick="alert('Application Rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                    <button class="btn btn-warning flex-1" onclick="alert('Clarification Requested')"><i class="fa-solid fa-circle-question"></i> Query</button>
                    <button class="btn btn-success flex-1" onclick="alert('Approved & Digitally Signed!')"><i class="fa-solid fa-check"></i> Approve & Issue</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Schedule/Berth View -->
    <template id="tpl-berth-schedule-view">
        <div class="panel">
            <div class="panel-header">
                <h3>Berth Allocation Schedule</h3>
                <div class="toggle-group">
                    <button class="btn btn-sm btn-outline active">Timeline View</button>
                    <button class="btn btn-sm btn-outline">Calendar View</button>
                </div>
            </div>
            <div class="gantt-chart-mock mt-4">
                <div class="gantt-y-axis">
                    <div class="berth-label">Berth A1</div>
                    <div class="berth-label">Berth A2</div>
                    <div class="berth-label">Berth B1</div>
                    <div class="berth-label">Berth C1 (Liquid)</div>
                </div>
                <div class="gantt-x-axis">
                    <div class="time-marker">08:00</div>
                    <div class="time-marker">12:00</div>
                    <div class="time-marker">16:00</div>
                    <div class="time-marker">20:00</div>
                    
                    <!-- Gantt Bars representing vessels -->
                    <div class="gantt-bar bg-blue" style="top: 0; left: 10%; width: 30%;">
                        Ever Glory
                    </div>
                    <div class="gantt-bar bg-purple" style="top: 25%; left: 45%; width: 40%;">
                        Oceanic Pioneer
                    </div>
                    <div class="gantt-bar bg-orange text-dark" style="top: 50%; left: 20%; width: 25%;">
                        Nordic Star
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
